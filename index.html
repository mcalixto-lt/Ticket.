  <style>
    #app{visibility:hidden}
    body.ticket-ready #app{visibility:visible}
    .ticket-touch-splash{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 22% 18%,rgba(139,105,255,.2),transparent 29%),radial-gradient(circle at 82% 76%,rgba(38,190,170,.14),transparent 27%),linear-gradient(145deg,#eef2fa,#faf8ff 48%,#edf1f8);overflow:hidden}
    .ticket-touch-splash::before,.ticket-touch-splash::after{content:'';position:absolute;border-radius:50%;filter:blur(2px);opacity:.62}.ticket-touch-splash::before{width:250px;height:250px;left:-75px;top:-70px;background:linear-gradient(145deg,rgba(133,96,242,.2),rgba(255,255,255,.05))}.ticket-touch-splash::after{width:210px;height:210px;right:-58px;bottom:-64px;background:linear-gradient(145deg,rgba(37,187,166,.14),rgba(118,83,230,.12))}
    .ticket-touch-animation{position:relative;width:min(390px,calc(100vw - 24px));height:min(780px,calc(100vh - 24px));display:grid;place-items:center;border:1px solid rgba(255,255,255,.78);border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(255,255,255,.08));box-shadow:0 30px 80px rgba(49,43,80,.15),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);overflow:hidden;animation:ticketTouchSession 3s ease both}
    .ticket-touch-content{display:grid;justify-items:center;transform:translateY(-10px)}
    .ticket-touch-icon{position:relative;width:154px;height:154px;display:grid;place-items:center;border-radius:43px;color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.88);box-shadow:0 26px 62px rgba(61,45,108,.18),inset 0 1px 0 rgba(255,255,255,.94),inset 0 -20px 45px rgba(103,69,197,.1);backdrop-filter:blur(32px) saturate(175%);-webkit-backdrop-filter:blur(32px) saturate(175%);overflow:visible}
    .ticket-touch-icon::before{content:'';position:absolute;inset:10px;border-radius:35px;background:linear-gradient(145deg,rgba(130,91,235,.14),rgba(63,27,137,.06));border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 12px rgba(255,255,255,.42)}
    .ticket-touch-print{position:relative;z-index:1;width:90px;height:90px;fill:none;stroke:url(#ticketPrintStroke);stroke-width:3.4;stroke-linecap:round;opacity:.52;filter:drop-shadow(0 4px 9px rgba(77,36,151,.14))}
    .ticket-touch-splash.run .ticket-touch-print{animation:ticketPrintGlow 1.18s steps(2,end) .82s forwards}
    .ticket-touch-ripple{position:absolute;width:54px;height:54px;border:3px solid rgba(255,255,255,.8);border-radius:50%;opacity:0}
    .ticket-touch-splash.run .ticket-touch-ripple{animation:ticketRipple .72s ease 1s forwards}
    .ticket-touch-finger{position:absolute;z-index:3;left:50%;bottom:-485px;width:360px;height:auto;filter:drop-shadow(0 16px 15px rgba(70,35,60,.23));transform:translate(-50%,670px);opacity:0;pointer-events:none}
    .ticket-touch-splash.run .ticket-touch-finger{animation:ticketFingerPress 1.9s cubic-bezier(.3,.8,.25,1) .24s forwards}
    .ticket-touch-check{position:absolute;right:-10px;bottom:-10px;width:50px;height:50px;display:grid;place-items:center;border:5px solid #fff;border-radius:50%;background:#15a56d;color:#fff;font-size:25px;font-weight:900;opacity:0;transform:scale(1.7) rotate(-15deg)}
    .ticket-touch-splash.run .ticket-touch-check{animation:ticketCheckStamp .44s cubic-bezier(.2,1.5,.4,1) 1.9s forwards}
    .ticket-touch-name{position:relative;z-index:2;display:flex;align-items:center;margin:0 0 38px;min-height:43px;font-size:2rem;font-weight:900;letter-spacing:-.04em;background:none;border:0;box-shadow:none;filter:none}
    .ticket-touch-name span{position:relative;display:inline-block;opacity:0;transform:translateY(7px) scale(.92)}
    .ticket-touch-name span::after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:30px;border-radius:2px;background:currentColor;opacity:0}
    .ticket-touch-splash.run .ticket-touch-name span{animation:ticketLetterType .16s cubic-bezier(.2,.8,.25,1) var(--type-delay) forwards}
    .ticket-touch-splash.run .ticket-touch-name span::after{animation:ticketInlineCaret .15s steps(1,end) var(--type-delay) forwards}
    .ticket-touch-name span:nth-child(1){--type-delay:.12s;color:#6e44d4}.ticket-touch-name span:nth-child(2){--type-delay:.27s;color:#3478ef}.ticket-touch-name span:nth-child(3){--type-delay:.42s;color:#16a6ce}.ticket-touch-name span:nth-child(4){--type-delay:.57s;color:#13a66c}.ticket-touch-name span:nth-child(5){--type-delay:.72s;color:#f08b31}.ticket-touch-name span:nth-child(6){--type-delay:.87s;color:#ed5f79}.ticket-touch-name span:nth-child(7){--type-delay:1.02s;color:#7247d4}
    .ticket-touch-splash.run .ticket-touch-name span:last-child::after{animation-duration:.26s}
    @keyframes ticketFingerPress{0%{transform:translate(-50%,670px);opacity:0}12%{opacity:1}43%,67%{transform:translate(-50%,35px);opacity:1}82%{opacity:.42}100%{transform:translate(-50%,680px);opacity:0}}
    @keyframes ticketPrintGlow{0%,100%{opacity:.56;stroke:#7650cf;filter:drop-shadow(0 4px 9px rgba(77,36,151,.15))}22%,62%{opacity:1;stroke:#fff;filter:drop-shadow(0 0 12px rgba(255,255,255,.96))}}
    @keyframes ticketRipple{0%{opacity:.85;transform:scale(.35)}100%{opacity:0;transform:scale(2.1)}}
    @keyframes ticketCheckStamp{0%{opacity:0;transform:scale(1.7) rotate(-15deg)}70%{opacity:1;transform:scale(.9) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
    @keyframes ticketLetterType{to{opacity:1;transform:none}}
    @keyframes ticketInlineCaret{0%,78%{opacity:1}79%,100%{opacity:0}}
    @keyframes ticketTouchSession{0%{opacity:0;transform:scale(.9)}10%,88%{opacity:1;transform:none}100%{opacity:0;transform:scale(.97)}}
    @media(max-width:520px){.ticket-touch-splash{padding:0}.ticket-touch-animation{width:100vw;height:100vh;max-height:none;border:0;border-radius:0}.ticket-touch-content{transform:translateY(-4vh)}}
    @media(prefers-reduced-motion:reduce){.ticket-touch-animation,.ticket-touch-print,.ticket-touch-ripple,.ticket-touch-finger,.ticket-touch-check,.ticket-touch-name span{animation-timing-function:linear!important}}
    #cameraVideo:not(.hidden){z-index:4}
    .record-lock-chip{position:static!important;grid-column:1/-1;justify-self:end;margin-top:-4px;order:2}
    .record-evidence-strip{order:1}
    .v109-ai-status{display:inline-flex;margin-left:6px;padding:3px 8px;border-radius:999px;background:rgba(106,67,190,.08);color:#6f46c4;font-size:.64rem;font-weight:800;white-space:nowrap}
    .v110-web-toggle.active{background:rgba(69,125,255,.12)!important;color:#2b67d8!important;border-color:rgba(69,125,255,.22)!important}
    @media(max-width:760px){.record-lock-chip{margin-top:-2px}.v109-ai-status{display:inline-flex;margin:6px 0 0}}
  </style>

        <svg class="ticket-touch-print" viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="ticketPrintStroke" x1="18" y1="18" x2="78" y2="82" gradientUnits="userSpaceOnUse"><stop stop-color="#9a79ff"/><stop offset="1" stop-color="#4b218f"/></linearGradient></defs><path d="M19 47v-7a29 29 0 0 1 58 0v10"/><path d="M28 53V40a20 20 0 0 1 40 0v15c0 13-4 24-11 33"/><path d="M37 55V40a11 11 0 0 1 22 0v15c0 10-3 19-8 26"/><path d="M46 56V40a2 2 0 0 1 4 0v16c0 8-2 15-6 22"/><path d="M20 57c1 11 5 21 12 29"/><path d="M29 60c1 8 4 15 9 21"/></svg>

      </div>

  <script>
    (()=>{
      let resolveSplash;
      window.__ticketSplashDone=new Promise(resolve=>{resolveSplash=resolve;});
      const splash=document.getElementById('ticketBootSplash');
      const animation=splash?.querySelector('.ticket-touch-animation');
      const startedAt=performance.now();
      let closed=false;
      const finish=()=>{
        if(closed)return;
        const remaining=Math.max(0,3000-(performance.now()-startedAt));
        setTimeout(()=>{
          if(closed)return;
          closed=true;
          splash?.remove();
          document.body.classList.add('ticket-ready');
          resolveSplash();
        },remaining);
      };
      animation?.addEventListener('animationend',finish,{once:true});
      requestAnimationFrame(()=>splash?.classList.add('run'));
      setTimeout(finish,3100);
    })();
  </script>
